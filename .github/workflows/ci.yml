name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nazareth
          POSTGRES_PASSWORD: nazareth
          POSTGRES_DB: nazareth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nazareth"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://nazareth:nazareth@localhost:5432/nazareth_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: |
          npx tsc --noEmit -p packages/core
          npx tsc --noEmit -p apps/web

      - name: Migrate test database
        run: npm run db:migrate

      - name: Seed test database
        run: npm run db:seed

      - name: Test (unit + schema + integration)
        run: npm test

      - name: Build (production)
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — verifies the Dockerfile)
        run: docker build --progress=plain -t nazareth-chms:ci .
